name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Offline pipeline smoke test (including figures)
        run: |
          python run_tcc_experiments.py prepare --config experiments/example_scenarios.json --output outputs/ci-inputs
          python run_tcc_experiments.py run --config outputs/ci-inputs/scenarios.json --output outputs/ci-run
